<!DOCTYPE html>
<html>

<head>
	<!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
	<meta
		http-equiv="Content-Security-Policy"
		content="default-src 'self'; script-src 'self'"
	>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="node_modules/meslo/meslo.css">
	<link rel="stylesheet" href="style.css">
	<title>system</title>
</head>

<body>
	<dialog id="dialog-open-space">
		<p>space id</p>
		<input id="input-space-id" size="36">
		<button id="button-open-space">open</button>
	</dialog>
	<h1>knyte.space runtime</h1>
	<ul>
		<li>
			Instance ID <span id="app-instance-id"></span>
		</li>
		<li>
			Node.js <span id="node-version"></span>
		</li>
		<li>
			Chromium <span id="chrome-version"></span>
		</li>
		<li>
			Electron <span id="electron-version"></span>
		</li>
		<li>
			Executable root path "<span id="root-path"></span>"
		</li>
		<li>
			DB userdata path "<span id="db-path"></span>"
		</li>
		<li>
			Typical RAM limits: 4 GB for render process,
			2 GB for ArrayBuffer
		</li>
	</ul>
	<p>
		<button id="button-memtest-node">
			memtest node.js
		</button>
		<span id="result-memtest-node"></span>
		<button id="button-memtest-chromium">
			memtest chromium
		</button>
		<span id="result-memtest-chromium"></span>
	</p>
	<p>
		Discovery
		<div>
			<button id="button-multicast-discovery">
				refresh
			</button>
			<table>
				<thead>
					<tr>
						<th>instance id</th>
						<th>activity</th>
					</tr>
				</thead>
				<tbody id="result-discovery">
				</tbody>
			</table>
		</div>
	</p>
	<p>
		Spaces
		<div>
			<button id="button-add-space">
				add space
			</button>
		</div>
	</p>

	<script src="./renderer.js"></script>
</body>

</html>
